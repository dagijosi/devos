<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
  </defs>
  <rect width="1024" height="1024" rx="200" fill="url(#bg)"/>
  <!-- Terminal window -->
  <rect x="262" y="312" width="500" height="400" rx="40" fill="none" stroke="url(#accent)" stroke-width="16"/>
  <!-- Title bar dots -->
  <circle cx="306" cy="368" r="14" fill="#ef4444"/>
  <circle cx="356" cy="368" r="14" fill="#eab308"/>
  <circle cx="406" cy="368" r="14" fill="#22c55e"/>
  <!-- Prompt line -->
  <text x="320" y="500" font-family="monospace" font-size="80" font-weight="bold" fill="#e2e8f0">&gt;</text>
  <text x="360" y="500" font-family="monospace" font-size="80" font-weight="bold" fill="#60a5fa">_</text>
  <!-- Second line -->
  <text x="320" y="600" font-family="monospace" font-size="80" font-weight="bold" fill="#e2e8f0">&gt;</text>
  <text x="360" y="600" font-family="monospace" font-size="80" fill="#94a3b8">dev</text>
  <!-- Text below -->
  <text x="512" y="780" font-family="sans-serif" font-size="72" font-weight="bold" fill="#e2e8f0" text-anchor="middle">DevOS</text>
</svg>
