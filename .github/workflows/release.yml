name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  deployments: write

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        # platform: [ubuntu-latest, macos-latest, windows-latest]
        platform: [windows-latest]

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      # - name: Install dependencies (Linux)
      #   if: matrix.platform == 'ubuntu-latest'
      #   run: |
      #     sudo apt-get update
      #     sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install frontend dependencies
        run: npm ci

      - name: Get commit message for release notes
        id: release_notes
        shell: pwsh
        run: |
          # Get the commit message for the tag
          $commitMsg = git log -1 --pretty=format:"%s" ${{ github.ref_name }}
          # Get the full commit body for detailed notes
          $commitBody = git log -1 --pretty=format:"%b" ${{ github.ref_name }}
          # Combine them
          if ($commitBody -ne "") {
            $notes = "$commitMsg`n`n$commitBody"
          } else {
            $notes = $commitMsg
          }
          # Use heredoc syntax for multi-line output
          "notes<<EOF" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          $notes | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "EOF" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Host "Commit message: $commitMsg"

      - name: Build Tauri app with signing
        uses: tauri-apps/tauri-action@v0.5.12
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Unencrypted private key (no password). Set repo secret TAURI_PRIVATE_KEY
          # to the full contents of .tauri-updater.key — do NOT set TAURI_KEY_PASSWORD.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          TAURI_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'DevOS ${{ github.ref_name }}'
          releaseBody: ${{ steps.release_notes.outputs.notes }}
          # Must be published (not draft) so /releases/latest/download/latest.json resolves for the updater
          releaseDraft: false
          prerelease: false
          uploadUpdaterJson: true
          updaterJsonPreferNsis: true

      - name: Generate latest.json
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}"
          $versionWithoutV = $version -replace '^v', ''
          $bundleRoot = "src-tauri/target/release/bundle"
          $nsisDir = Join-Path $bundleRoot "nsis"
          New-Item -ItemType Directory -Path $nsisDir -Force | Out-Null

          Write-Host "Bundle tree:"
          Get-ChildItem -Path $bundleRoot -Recurse -File -ErrorAction SilentlyContinue |
            Select-Object -ExpandProperty FullName |
            ForEach-Object { Write-Host "  $_" }

          if (-not $env:TAURI_SIGNING_PRIVATE_KEY -and -not $env:TAURI_PRIVATE_KEY) {
            throw "TAURI_PRIVATE_KEY secret is empty. Add the minisign private key as repo secret TAURI_PRIVATE_KEY."
          }

          $setup = Get-ChildItem -Path $nsisDir -Filter "*-setup.exe" -ErrorAction SilentlyContinue |
            Sort-Object LastWriteTime -Descending |
            Select-Object -First 1
          if (-not $setup) {
            throw "NSIS setup.exe not found in $nsisDir"
          }

          $sigPath = "$($setup.FullName).sig"
          if (-not (Test-Path $sigPath)) {
            $sigPath = Get-ChildItem -Path $bundleRoot -Recurse -Filter "*.sig" -ErrorAction SilentlyContinue |
              Where-Object { $_.Name -like "*setup*.sig" -or $_.Name -like "*.exe.sig" } |
              Sort-Object LastWriteTime -Descending |
              Select-Object -First 1 -ExpandProperty FullName
          }
          if (-not $sigPath -or -not (Test-Path $sigPath)) {
            throw "Updater signature (.sig) not found next to $($setup.Name). Signing did not run — ensure secret TAURI_PRIVATE_KEY is the minisign private key matching tauri.conf.json pubkey."
          }
          $signature = (Get-Content -Path $sigPath -Raw).Trim()
          if (-not $signature) {
            throw "Signature file is empty: $sigPath"
          }

          $url = "https://github.com/dagijosi/devos/releases/download/$version/$($setup.Name)"
          $platform = @{
            signature = $signature
            url = $url
          }
          $notes = "${{ steps.release_notes.outputs.notes }}"
          $payload = [ordered]@{
            version = $versionWithoutV
            notes = $notes
            pub_date = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ")
            platforms = [ordered]@{
              "windows-x86_64-nsis" = $platform
              "windows-x86_64" = $platform
            }
          }
          $outPath = Join-Path $nsisDir "latest.json"
          # UTF-8 without BOM — BOM breaks updater JSON parsing
          $utf8 = New-Object System.Text.UTF8Encoding $false
          [System.IO.File]::WriteAllText($outPath, ($payload | ConvertTo-Json -Depth 10), $utf8)
          Write-Host "Wrote $outPath from $sigPath"
          Get-Content $outPath
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          TAURI_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}

      - name: Upload latest.json to release
        run: |
          gh release upload "${{ github.ref_name }}" src-tauri/target/release/bundle/nsis/latest.json --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Cleanup old releases to prevent storage from filling up
  cleanup:
    runs-on: ubuntu-latest
    if: always()
    needs: release
    steps:
      - uses: actions/checkout@v4
      - name: Delete old releases
        uses: dev-drprasad/delete-older-releases@v0.3.2
        with:
          keep_latest: 5
          delete_tag_pattern: v*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
