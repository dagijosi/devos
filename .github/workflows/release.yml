name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  deployments: write

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        # platform: [ubuntu-latest, macos-latest, windows-latest]
        platform: [windows-latest]

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      # - name: Install dependencies (Linux)
      #   if: matrix.platform == 'ubuntu-latest'
      #   run: |
      #     sudo apt-get update
      #     sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install frontend dependencies
        run: npm ci

      - name: Build Tauri app with signing
        uses: tauri-apps/tauri-action@v0.5.12
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          TAURI_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'DevOS ${{ github.ref_name }}'
          releaseBody: 'See the assets to download this version and install.'
          # Must be published (not draft) so /releases/latest/download/latest.json resolves for the updater
          releaseDraft: false
          prerelease: false

      - name: Generate latest.json
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}"
          $versionWithoutV = $version -replace '^v', ''
          $nsisDir = "src-tauri/target/release/bundle/nsis"
          New-Item -ItemType Directory -Path $nsisDir -Force | Out-Null

          $setup = Get-ChildItem -Path $nsisDir -Filter "*-setup.exe" -ErrorAction SilentlyContinue |
            Sort-Object LastWriteTime -Descending |
            Select-Object -First 1
          if (-not $setup) {
            throw "NSIS setup.exe not found in $nsisDir"
          }

          $sigPath = "$($setup.FullName).sig"
          if (-not (Test-Path $sigPath)) {
            $sigPath = Get-ChildItem -Path $nsisDir -Filter "*.sig" -ErrorAction SilentlyContinue |
              Select-Object -First 1 -ExpandProperty FullName
          }
          if (-not $sigPath -or -not (Test-Path $sigPath)) {
            throw "Updater signature (.sig) not found next to $($setup.Name). Ensure TAURI_PRIVATE_KEY is set."
          }
          $signature = (Get-Content -Path $sigPath -Raw).Trim()

          $url = "https://github.com/dagijosi/devos/releases/download/$version/$($setup.Name)"
          $platform = @{
            signature = $signature
            url = $url
          }
          $payload = [ordered]@{
            version = $versionWithoutV
            notes = "DevOS $version"
            pub_date = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ")
            platforms = [ordered]@{
              "windows-x86_64-nsis" = $platform
              "windows-x86_64" = $platform
            }
          }
          $outPath = Join-Path $nsisDir "latest.json"
          # UTF-8 without BOM — BOM breaks updater JSON parsing
          $utf8 = New-Object System.Text.UTF8Encoding $false
          [System.IO.File]::WriteAllText($outPath, ($payload | ConvertTo-Json -Depth 10), $utf8)
          Write-Host "Wrote $outPath"
          Get-Content $outPath

      - name: Upload latest.json to release
        run: |
          gh release upload "${{ github.ref_name }}" src-tauri/target/release/bundle/nsis/latest.json --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Cleanup old releases to prevent storage from filling up
  cleanup:
    runs-on: ubuntu-latest
    if: always()
    needs: release
    steps:
      - uses: actions/checkout@v4
      - name: Delete old releases
        uses: dev-drprasad/delete-older-releases@v0.3.2
        with:
          keep_latest: 5
          delete_tag_pattern: v*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
