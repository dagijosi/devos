name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  deployments: write

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        # platform: [ubuntu-latest, macos-latest, windows-latest]
        platform: [windows-latest]

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      # - name: Install dependencies (Linux)
      #   if: matrix.platform == 'ubuntu-latest'
      #   run: |
      #     sudo apt-get update
      #     sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install frontend dependencies
        run: npm ci

      - name: Build Tauri app with signing
        uses: tauri-apps/tauri-action@v0.5.12
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          TAURI_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'DevOS ${{ github.ref_name }}'
          releaseBody: 'See the assets to download this version and install.'
          releaseDraft: true
          prerelease: false

      - name: Generate and sign latest.json
        shell: pwsh
        env:
          TAURI_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          TAURI_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}
        run: |
          $version = "${{ github.ref_name }}"
          $url = "https://github.com/dagijosi/devos/releases/download/$version/DevOS_${version}_x64-setup.exe"
          
          # Create latest.json
          $json = @{
            version = $version
            notes = "DevOS $version"
            pub_date = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ")
            platforms = @{
              "windows-x86_64" = @{
                signature = ""
                url = $url
              }
            }
          } | ConvertTo-Json -Depth 10
          
          # Save to temp file
          $json | Out-File -FilePath "latest.json" -Encoding utf8
          
          # Sign it with tauri
          npm run tauri -- signer sign latest.json
          
          # Move signed version to release directory
          Move-Item -Force -Path "latest.json.sig" -Destination "src-tauri/target/release/bundle/nsis/latest.json.sig"
          Move-Item -Force -Path "latest.json" -Destination "src-tauri/target/release/bundle/nsis/latest.json"

      - name: Upload latest.json to release
        uses: softprops/action-gh-release@v1
        if: success()
        with:
          files: src-tauri/target/release/bundle/nsis/latest.json
          append_existing: true
          draft: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Cleanup old releases to prevent storage from filling up
  cleanup:
    runs-on: ubuntu-latest
    if: always()
    needs: release
    steps:
      - uses: actions/checkout@v4
      - name: Delete old releases
        uses: dev-drprasad/delete-older-releases@v0.3.2
        with:
          keep_latest: 5
          delete_tag_pattern: v*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
